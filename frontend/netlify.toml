[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Arahkan seluruh rute React Router ke index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache optimasi untuk static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
