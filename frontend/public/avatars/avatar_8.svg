<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="j_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="glow_08" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Studio -->
  <rect width="400" height="400" fill="url(#bg_08)"/>
  <circle cx="200" cy="180" r="140" fill="#6366F1" opacity="0.15" filter="url(#glow_08)"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>

  <!-- Jersey Torso / Body -->
  <path d="M 100 400 L 100 320 Q 120 270 200 270 Q 280 270 300 320 L 300 400 Z" fill="url(#j_08)"/>
  <path d="M 150 270 L 200 310 L 250 270 Z" fill="#0F172A"/>
  
  <!-- Jersey Details / Collar & Number -->
  <path d="M 120 330 L 140 400 M 280 330 L 260 400" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <text x="200" y="370" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" opacity="0.95">08</text>
  <text x="200" y="392" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#6366F1" text-anchor="middle" letter-spacing="2">PHANTOM</text>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="65" rx="10" fill="#FCD34D" filter="brightness(0.9)"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="175" rx="58" ry="70" fill="#FCD34D"/>

  <!-- Hair -->
  <path d="M 140 160 Q 140 100 200 95 Q 260 100 260 160 Q 240 120 200 120 Q 160 120 140 160 Z" fill="#312E81"/>
  <path d="M 150 130 Q 200 105 245 125" stroke="#312E81" stroke-width="12" stroke-linecap="round"/>

  <!-- Eyes & Eyebrows -->
  <rect x="165" y="155" width="22" height="5" rx="2" fill="#312E81"/>
  <rect x="213" y="155" width="22" height="5" rx="2" fill="#312E81"/>
  <circle cx="176" cy="175" r="5" fill="#0F172A"/>
  <circle cx="224" cy="175" r="5" fill="#0F172A"/>
  <circle cx="178" cy="173" r="1.5" fill="#FFFFFF"/>
  <circle cx="226" cy="173" r="1.5" fill="#FFFFFF"/>

  <!-- Nose & Confident Smile -->
  <path d="M 200 175 L 196 195 L 204 195" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 185 212 Q 200 224 215 212" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>

  <!-- Esports Gaming Headset -->
  <path d="M 135 175 Q 135 70 200 70 Q 265 70 265 175" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <path d="M 160 80 Q 200 74 240 80" fill="none" stroke="#6366F1" stroke-width="4"/>
  <rect x="124" y="150" width="22" height="50" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="2.5" filter="url(#glow_08)"/>
  <rect x="254" y="150" width="22" height="50" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="2.5" filter="url(#glow_08)"/>
  <path d="M 135 190 Q 150 220 180 220" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <circle cx="182" cy="220" r="5" fill="#6366F1"/>

  <!-- Arena Lighting Overlays -->
  <path d="M 0 0 L 100 0 L 0 100 Z" fill="#6366F1" opacity="0.3"/>
  <circle cx="20" cy="20" r="3" fill="#FFFFFF"/>
</svg>