services:
  - type: web
    name: pulse-scout-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ML_ARTIFACTS_DIR
        value: artifacts
      - key: CORS_ORIGINS
        value: "*"
